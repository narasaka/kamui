name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tags must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          git fetch origin main
          commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "release tag must point to a commit on main" >&2
            exit 1
          fi
          {
            echo "version=${GITHUB_REF_NAME#v}"
            echo "commit=$commit"
            echo "build_date=$(git show -s --format=%cI "$commit")"
          } >> "$GITHUB_OUTPUT"

      - name: Require Homebrew tap credential
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "HOMEBREW_TAP_TOKEN must have contents write access to narasaka/homebrew-tap" >&2
            exit 1
          fi

      # `brew install narasaka/tap/kamui` installs the app, so every release
      # needs a signed and notarized one.
      - name: Require menu bar app signing credentials
        env:
          MACOS_DEVELOPER_ID_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        shell: bash
        run: |
          names=(MACOS_DEVELOPER_ID_P12 MACOS_DEVELOPER_ID_P12_PASSWORD APPLE_NOTARY_KEY_P8 APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID)
          missing=()
          for name in "${names[@]}"; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "missing menu bar app release secrets: ${missing[*]}; see docs/install.md" >&2
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check source
        run: make check

      - name: Build release artifacts
        env:
          KAMUI_BUILD_COMMIT: ${{ steps.release.outputs.commit }}
          KAMUI_BUILD_DATE: ${{ steps.release.outputs.build_date }}
        run: make package VERSION=${{ steps.release.outputs.version }}

      # rustup installs the toolchain and targets in macos/rust-toolchain.toml.
      - name: Check menu bar app
        run: make check-macos-app

      - name: Import Developer ID certificate
        id: keychain
        env:
          MACOS_DEVELOPER_ID_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/kamui-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          certificate="$RUNNER_TEMP/developer-id.p12"
          trap 'rm -f "$certificate"' EXIT
          printf '%s' "$MACOS_DEVELOPER_ID_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [[ -z "$identity" ]]; then
            echo "MACOS_DEVELOPER_ID_P12 has no valid Developer ID Application identity." >&2
            echo "It must include the Developer ID G2 intermediate; see docs/install.md." >&2
            security find-identity -p codesigning "$keychain" >&2
            exit 1
          fi
          {
            echo "path=$keychain"
            echo "identity=$identity"
          } >> "$GITHUB_OUTPUT"

      - name: Build, sign, and notarize menu bar app
        env:
          VERSION: ${{ steps.release.outputs.version }}
          KAMUI_BUILD_COMMIT: ${{ steps.release.outputs.commit }}
          KAMUI_BUILD_DATE: ${{ steps.release.outputs.build_date }}
          KAMUI_CODESIGN_IDENTITY: ${{ steps.keychain.outputs.identity }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          KAMUI_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          KAMUI_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        shell: bash
        run: |
          export KAMUI_NOTARY_KEY="$RUNNER_TEMP/notary-key.p8"
          trap 'rm -f "$KAMUI_NOTARY_KEY"' EXIT
          printf '%s\n' "$APPLE_NOTARY_KEY_P8" > "$KAMUI_NOTARY_KEY"
          scripts/build-macos-app.sh "$VERSION"
          rm -rf dist/Kamui.app

      - name: Remove signing keychain
        if: always() && steps.keychain.outputs.path != ''
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.path }}
        run: security delete-keychain "$KEYCHAIN"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --verify-tag \
              --title "Kamui $TAG" \
              --generate-notes
          fi

      - name: Check out Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: narasaka/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew formula and cask
        env:
          VERSION: ${{ steps.release.outputs.version }}
          KAMUI_BUILD_COMMIT: ${{ steps.release.outputs.commit }}
          KAMUI_BUILD_DATE: ${{ steps.release.outputs.build_date }}
        shell: bash
        run: |
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/narasaka/kamui/archive/refs/tags/v${VERSION}.tar.gz" \
            --output source.tar.gz
          source_sha="$(shasum -a 256 source.tar.gz | awk '{print $1}')"
          scripts/update-homebrew-tap.rb homebrew-tap "$VERSION" "$source_sha" \
            "dist/Kamui_${VERSION}_macos.zip"

      - name: Publish Homebrew formula and cask
        working-directory: homebrew-tap
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "The tap already describes v${VERSION}"
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "kamui: update to v${VERSION}"
          git push origin HEAD:main
