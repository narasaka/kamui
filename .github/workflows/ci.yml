name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.select.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select jobs for the changed paths
        id: select
        shell: bash
        run: |
          # Pull requests check out a merge commit whose first parent is the base branch.
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            git diff --name-only --no-renames HEAD^1 HEAD | scripts/ci-jobs.sh
          else
            scripts/ci-jobs.sh --all
          fi >> "$GITHUB_OUTPUT"

  format:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'go')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: make check-format

  lint:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'go')
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .golangci-lint-version

  test:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'go')
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build Unix release binaries
        if: runner.os == 'macOS'
        run: scripts/package.sh ci

  site:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'site')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install site dependencies
        run: pnpm install --frozen-lockfile
      - name: Test docs link checks
        run: pnpm test
      - name: Build site from docs
        run: pnpm build

  macos-app:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'macos-app')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test menu bar app
        run: make check-macos-app
      - name: Build universal menu bar app
        run: KAMUI_OUTPUT_ROOT="$RUNNER_TEMP/kamui-app" scripts/build-macos-app.sh 0.0.0

  browser-smoke:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'browser-smoke')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install smoke-test browsers and certificate tooling
        run: |
          brew list --cask google-chrome >/dev/null 2>&1 || brew install --cask google-chrome
          brew list --cask brave-browser >/dev/null 2>&1 || brew install --cask brave-browser
          brew list --cask firefox >/dev/null 2>&1 || brew install --cask firefox
          brew list --formula nss >/dev/null 2>&1 || brew install nss
      - name: Gate primary browser protocols
        env:
          KAMUI_BROWSER_TESTS: "1"
          KAMUI_REQUIRED_BROWSERS: "chrome,brave,firefox"
        run: go test -race ./integration -run 'TestInstalledBrowsersUseKamuiProxy/(chrome|brave|firefox)$|TestChrome' -count=1 -v

  linux-browser-smoke:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'browser-smoke')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux SSH test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openssh-server iproute2
          sudo install -d -m 0755 /run/sshd
      - name: Require native Linux browsers from the runner image
        run: |
          command -v google-chrome
          command -v firefox
      - name: Gate native Linux browser proxying and OpenSSH discovery
        env:
          KAMUI_BROWSER_TESTS: "1"
          KAMUI_REQUIRED_BROWSERS: "chrome,firefox"
        run: go test -race ./integration -run 'TestNativeLinuxBrowsersUseKamuiProxy/(chrome|firefox)$|TestRemoteListenerDiscoveryWithDisposableOpenSSHServer' -count=1 -v

  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, format, lint, test, site, macos-app, browser-smoke, linux-browser-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected job to pass
        # always() keeps this step from being skipped after a cancellation, which
        # would otherwise make the implicit success() check false.
        if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
        run: exit 1
