[package]
name = "kamui-app"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Kamui's macOS menu bar app, a client of the kamui CLI."

[lib]
name = "kamui_app"
path = "src/lib.rs"

[[bin]]
name = "kamui-app"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
url = "2"

# Rune is pre-release: pin one `dev` rev for all of its crates, and bump them
# together with `cargo update -p rune -p rune-kit -p rune-theme-opencode -p rune-mac`.
rune = { git = "https://github.com/anomalyco/rune.git", rev = "a138b97e654b8299b2a4cb518b8476b2b528c2c4", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune.git", rev = "a138b97e654b8299b2a4cb518b8476b2b528c2c4" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune.git", rev = "a138b97e654b8299b2a4cb518b8476b2b528c2c4" }
rune-mac = { git = "https://github.com/anomalyco/rune.git", rev = "a138b97e654b8299b2a4cb518b8476b2b528c2c4" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-service-management = { version = "0.3.2", features = ["SMAppService"] }

[profile.release]
strip = true
